name: Deploy independent bridge to Solana mainnet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Solana and Anchor
        id: tool-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cargo/bin
            ~/.avm
          key: solana-anchor-0.30.1-v5

      - name: Install Solana and Anchor
        if: steps.tool-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail

          curl --proto '=https' --tlsv1.2 -sSfL \
            https://solana-install.solana.workers.dev | bash

          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"

          avm install 0.30.1
          avm use 0.30.1

      - name: Configure tool paths
        shell: bash
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Verify installed tools
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"

          rustc --version
          cargo --version
          solana --version
          solana-keygen --version
          anchor --version

      - name: Generate compatible Cargo lockfile
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"

          rustup toolchain install 1.79.0 --profile minimal

          cargo +1.79.0 generate-lockfile

          cargo +1.79.0 update \
            -p 'borsh@1.8.1' \
            --precise 1.5.7

          cargo +1.79.0 update \
            -p 'proc-macro-crate@3.5.0' \
            --precise 3.1.0

          cargo +1.79.0 update \
            -p 'blake3' \
            --precise 1.5.5

          sed -i 's/^version = 4$/version = 3/' Cargo.lock

          echo "Cargo.lock version:"
          grep '^version = ' Cargo.lock | head -1

          echo "Relevant dependency versions:"
          cargo +1.79.0 tree |
            grep -E 'borsh v1\.|borsh-derive v1\.|proc-macro-crate|toml_edit|toml_datetime|blake3' |
            sort -u

          if cargo +1.79.0 tree | grep -q 'toml_datetime v1\.'; then
            echo "::error::Incompatible toml_datetime v1 remains in the dependency tree."
            exit 1
          fi

      - name: Validate deployment secrets
        shell: bash
        env:
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          set -euo pipefail

          if [ -z "${SOLANA_PRIVATE_KEY:-}" ]; then
            echo "::error::SOLANA_PRIVATE_KEY repository secret is missing."
            exit 1
          fi

          if [ -z "${SOLANA_RPC_URL:-}" ]; then
            echo "::error::SOLANA_RPC_URL repository secret is missing."
            exit 1
          fi

      - name: Build and deploy both programs
        shell: bash
        env:
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          set -euo pipefail

          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"

          python3 deploy.py | tee deployment-details.json

      - name: Upload deployment details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-details
          path: deployment-details.json
          if-no-files-found: warn
          retention-days: 30
