name: Deploy independent bridge to Solana mainnet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Solana and Anchor
        id: tool-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cargo/bin
            ~/.avm
          key: solana-anchor-0.30.1-v2

      - name: Install Solana and Anchor
        if: steps.tool-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSfL \
            https://solana-install.solana.workers.dev | bash

          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"

          avm install 0.30.1
          avm use 0.30.1

      - name: Configure tools
        shell: bash
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build and deploy both programs
        shell: bash
        env:
          SOLANA_PRIVATE_KEY: ${{ secrets.SOLANA_PRIVATE_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: |
          export PATH="$HOME/.cargo/bin:$HOME/.local/share/solana/install/active_release/bin:$PATH"

          solana --version
          anchor --version

          rustup toolchain install 1.79.0 --profile minimal
          cargo +1.79.0 generate-lockfile

          grep '^version' Cargo.lock
          python3 deploy.py | tee deployment-details.json

      - name: Save deployment details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-details
          path: deployment-details.json
          if-no-files-found: warn
          retention-days: 30
